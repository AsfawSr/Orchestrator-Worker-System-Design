# Prometheus ServiceMonitor for metrics scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orchestrator-worker-metrics
  labels:
    app: orchestrator-worker
spec:
  selector:
    matchLabels:
      app: orchestrator-worker
  endpoints:
  - port: management
    path: /actuator/prometheus
    interval: 15s
---
# Prometheus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'orchestrator-worker'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: orchestrator-worker
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
# Grafana ConfigMap for dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  orchestrator-dashboard.json: |
    {
      "dashboard": {
        "title": "Orchestrator-Worker Dashboard",
        "panels": [
          {
            "title": "Tasks Submitted Rate",
            "targets": [
              {
                "expr": "rate(tasks_submitted_total[5m])"
              }
            ]
          },
          {
            "title": "Tasks Completed Rate",
            "targets": [
              {
                "expr": "rate(tasks_completed_total[5m])"
              }
            ]
          },
          {
            "title": "Task Processing Duration (P95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(task_processing_duration_bucket[5m]))"
              }
            ]
          },
          {
            "title": "Queue Sizes",
            "targets": [
              {
                "expr": "queue_size"
              }
            ]
          },
          {
            "title": "Cache Hit Rate",
            "targets": [
              {
                "expr": "rate(cache_requests{result=\"hit\"}[5m]) / rate(cache_requests[5m])"
              }
            ]
          }
        ]
      }
    }
---
# Zipkin Deployment for distributed tracing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
      - name: zipkin
        image: openzipkin/zipkin:latest
        ports:
        - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-service
spec:
  selector:
    app: zipkin
  ports:
  - port: 9411
    targetPort: 9411
  type: ClusterIP
