spring:
  application:
    name: Orchestrator-Worker

  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # Creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1  # Process one message at a time per consumer

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000  # Default TTL: 10 minutes (in milliseconds)
      cache-null-values: false

# Redisson Configuration (for distributed locks)
redisson:
  single-server-config:
    address: redis://localhost:6379
    connection-pool-size: 64
    connection-minimum-idle-size: 10

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration
logging:
  level:
    root: INFO
    com.asfaw.Orchestrator_Worker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Worker Thread Pool Configuration (Flexible approach)
# Add new task types simply by adding a new entry under 'pools'
worker:
  pools:
    # Compute Worker Pool (CPU-intensive tasks)
    compute:
      core-size: 2
      max-size: 4
      queue-capacity: 100
      await-termination-seconds: 60
    
    # IO Worker Pool (I/O-bound tasks)
    io:
      core-size: 5
      max-size: 10
      queue-capacity: 100
      await-termination-seconds: 60
    
    # AI Worker Pool (ML/AI tasks)
    ai:
      core-size: 3
      max-size: 6
      queue-capacity: 100
      await-termination-seconds: 60
    
    # Example: Add new task types without code changes
    # video:
    #   core-size: 2
    #   max-size: 4
    #   queue-capacity: 50
    #   await-termination-seconds: 120

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
