spring:
  application:
    name: Orchestrator-Worker

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration
logging:
  level:
    root: INFO
    com.asfaw.Orchestrator_Worker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Worker Thread Pool Configuration
worker:
  # Compute Worker Pool (CPU-intensive tasks)
  compute:
    pool:
      core-size: 2
      max-size: 4
  
  # IO Worker Pool (I/O-bound tasks)
  io:
    pool:
      core-size: 5
      max-size: 10
  
  # AI Worker Pool (ML/AI tasks)
  ai:
    pool:
      core-size: 3
      max-size: 6
  
  # Queue capacity for each worker pool
  pool:
    queue-capacity: 100

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
