spring:
  application:
    name: Orchestrator-Worker

  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/shipment
    username: postgres
    password: Asfawpassword
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # Creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1  # Process one message at a time per consumer

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000  # Default TTL: 10 minutes (in milliseconds)
      cache-null-values: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration
logging:
  level:
    root: INFO
    com.asfaw.Orchestrator_Worker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Worker Thread Pool Configuration (Flexible approach)
# Add new task types simply by adding a new entry under 'pools'
worker:
  pools:
    # Compute Worker Pool (CPU-intensive tasks)
    compute:
      core-size: 2
      max-size: 4
      queue-capacity: 100
      await-termination-seconds: 60
    
    # IO Worker Pool (I/O-bound tasks)
    io:
      core-size: 5
      max-size: 10
      queue-capacity: 100
      await-termination-seconds: 60
    
    # AI Worker Pool (ML/AI tasks)
    ai:
      core-size: 3
      max-size: 6
      queue-capacity: 100
      await-termination-seconds: 60
    
    # Example: Add new task types without code changes
    # video:
    #   core-size: 2
    #   max-size: 4
    #   queue-capacity: 50
    #   await-termination-seconds: 120

# Management endpoints (Actuator + Prometheus + Tracing)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # Kubernetes liveness & readiness probes
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests (use 0.1 for 10% in production)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
