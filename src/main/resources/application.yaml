spring:
  application:
    name: Orchestrator-Worker

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Logging Configuration
logging:
  level:
    root: INFO
    com.asfaw.Orchestrator_Worker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Worker Thread Pool Configuration (Flexible approach)
# Add new task types simply by adding a new entry under 'pools'
worker:
  pools:
    # Compute Worker Pool (CPU-intensive tasks)
    compute:
      core-size: 2
      max-size: 4
      queue-capacity: 100
      await-termination-seconds: 60
    
    # IO Worker Pool (I/O-bound tasks)
    io:
      core-size: 5
      max-size: 10
      queue-capacity: 100
      await-termination-seconds: 60
    
    # AI Worker Pool (ML/AI tasks)
    ai:
      core-size: 3
      max-size: 6
      queue-capacity: 100
      await-termination-seconds: 60
    
    # Example: Add new task types without code changes
    # video:
    #   core-size: 2
    #   max-size: 4
    #   queue-capacity: 50
    #   await-termination-seconds: 120

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
